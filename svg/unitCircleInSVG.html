<svg width="500" height="500" viewBox="0 20 590 550" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#1E3A5F" stroke-width="0.5" opacity="0.2"/>
        </pattern>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
            <rect width="50" height="50" fill="url(#smallGrid)"/>
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1E3A5F" stroke-width="1" opacity="0.1"/>
        </pattern>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#1E3A5F" />
        </marker>
        <marker id="arrowheadGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="rgb(27, 189, 126)" />
        </marker>
        <marker id="arrowheadBrighterBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#3C6EB0" />
        </marker>
        <marker id="vectorArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="rgba(245, 123, 79, 0.9)" />
        </marker>
    </defs>

    <rect width="100%" height="100%" fill="url(#grid)" />

    <line x1="50" y1="300" x2="550" y2="300" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arrowhead)" />
    <line x1="300" y1="550" x2="300" y2="50" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arrowhead)" />

    <circle cx="300" cy="300" r="180" fill="none" stroke="#1E4262" stroke-width="2" />

    <line x1="300" y1="300" x2="427" y2="173" stroke="rgba(245, 123, 79, 0.9)" stroke-width="3" marker-end="url(#vectorArrow)" />
    <path d="M 350 300 A 50 50 0 0 0 335.3 264.6" fill="none" stroke="rgb(27, 189, 126)" stroke-width="2" marker-end="url(#arrowheadGreen)" />

    <path d="M 510 260 A 200 200 0 0 0 490 210" fill="none" stroke="#3C6EB0" stroke-width="2" marker-end="url(#arrowheadBrighterBlue)" />

    <g font-family="Cambria, Georgia, serif" font-size="18" fill="#1E3A5F">
        <text x="525" y="325">cosine</text>
        <text x="260" y="45">sine</text>
        <text x="285" y="320">O</text>
        <text x="357" y="282" fill="rgb(27, 189, 126)" font-style="italic">θ</text>
        <text x="510" y="225" fill="#3C6EB0" font-size="14" font-weight="bold">(+)</text>
    </g>

    <g font-family="Cambria, Georgia, serif" font-size="20" font-weight="bold" fill="rgb(27, 189, 126)">
        <text x="410" y="110">All positive</text>
            <text x="750" y="110">
            <tspan x="75" dy="0">Only sin</tspan>
            <tspan x="75" dy="20">is positive</tspan>
            </text>
            <text x="75" y="500">
            <tspan x="75" dy="0">Only tan, cot</tspan>
            <tspan x="75" dy="20">are positive</tspan>
            </text>
            <text x="410" y="500">
            <tspan x="410" dy="0">Only cos</tspan>
            <tspan x="410" dy="20">is positive</tspan>
            </text>
    </g>
</svg>
